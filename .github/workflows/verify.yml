name: Verify RoggenCore

on:
  push:
  pull_request:

jobs:
  software:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test manager and core
        run: dotnet test RoggenCore.sln -c Release
      - name: Check Studio JavaScript
        run: npm test && npm run check
      - name: Build ESP32 bridge
        run: |
          python -m pip install platformio
          platformio run

  nrf-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM build tools
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi ninja-build unzip
      - name: Download Nordic SDK 17.1.0
        run: |
          curl --fail --location --output /tmp/nrf5.zip https://developer.nordicsemi.com/nRF5_SDK/nRF5_SDK_v17.x.x/nRF5_SDK_17.1.0_ddde560.zip
          unzip -q /tmp/nrf5.zip -d /tmp/nrf5
      - name: Build RoggenCore firmware
        run: |
          cmake -S Tag_BLE_Photo_Viewer -B Tag_BLE_Photo_Viewer/build -G Ninja -DNRF5_SDK_ROOT=/tmp/nrf5/nRF5_SDK_17.1.0_ddde560 -DARM_GCC_ROOT=/usr
          cmake --build Tag_BLE_Photo_Viewer/build
